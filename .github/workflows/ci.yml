# Free-tier only: standard ubuntu-latest (no larger / GPU / self-hosted runners).
# Tests only — packaging lives in release.yml (build once → smoke → publish).
# Path filters skip expensive steps on docs-only PRs; job name stays `test` for branch protection.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'docker/**'
              - 'docker-compose.yml'
              - 'scripts/**'
            ui:
              - 'ui/**'
              - 'src-tauri/**'
              - 'docker/test/**'
      - name: Fixture check
        if: github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true'
        run: docker compose run --rm fixtures
      - name: Keep-rules contract
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        run: node docker/test/keep_rules_test.mjs
      - name: Session logic
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        run: node docker/test/session_logic_test.mjs
      - name: Rust tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true'
        run: docker compose run --rm rust-test
      - name: UI build
        if: github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true'
        run: docker compose run --rm ui bash -lc "npm install && npm run build"
      - name: Docs-only PR note
        if: github.event_name == 'pull_request' && steps.filter.outputs.rust != 'true' && steps.filter.outputs.ui != 'true'
        run: echo "No rust/ui paths changed — skipped heavy checks."
