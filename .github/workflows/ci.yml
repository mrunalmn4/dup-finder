# Free-tier only: standard ubuntu-latest (no larger / GPU / self-hosted runners).
# Public repos: Actions minutes on standard GitHub-hosted runners are free.
# Private repos: stays within included free-minute budget (Linux is cheapest).
#
# Tests only — packaging lives in release.yml (build once → smoke → publish).

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Fixture check
        run: docker compose run --rm fixtures
      - name: Keep-rules contract
        run: node docker/test/keep_rules_test.mjs
      - name: Session logic
        run: node docker/test/session_logic_test.mjs
      - name: Rust tests
        run: docker compose run --rm rust-test
      - name: UI build
        run: docker compose run --rm ui bash -lc "npm install && npm run build"
