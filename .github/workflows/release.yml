# Build once per platform → smoke those artifacts → publish (no second compile).
# Free-tier: standard hosted runners only. No cosign (optional later).
#
# Tag v* (or workflow_dispatch): quality gate → linux/mac/win matrix → GitHub Release + GHCR.
# Tauri GUI included when include_tauri=true (default). CLI-only hotfix: set include_tauri=false.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish (e.g. v0.1.0)
        required: true
        type: string
      include_desktop_hosts:
        description: Build macOS/Windows on free hosted runners
        required: true
        type: boolean
        default: true
      include_tauri:
        description: Build + smoke Tauri GUI (.app/.dmg / MSI) on macOS/Windows
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      desktop: ${{ steps.ver.outputs.desktop }}
      tauri: ${{ steps.ver.outputs.tauri }}
    steps:
      - id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DESKTOP: ${{ inputs.include_desktop_hosts }}
          INPUT_TAURI: ${{ inputs.include_tauri }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            DESKTOP="$INPUT_DESKTOP"
            TAURI="$INPUT_TAURI"
          else
            TAG="${GITHUB_REF_NAME}"
            DESKTOP=true
            TAURI=true
          fi
          case "$TAG" in v*) ;; *) echo "tag must start with v" >&2; exit 1 ;; esac
          if [ "$PRIVATE" = "true" ]; then
            DESKTOP=false
            TAURI=false
            echo "Private repo: skipping macOS/Windows hosted runners (free-minute cost)."
          fi
          if [ "$DESKTOP" != "true" ]; then
            TAURI=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "tauri=$TAURI" >> "$GITHUB_OUTPUT"

  quality-gate:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Fixture check
        run: docker compose run --rm fixtures
      - name: Keep-rules contract
        run: node docker/test/keep_rules_test.mjs
      - name: Session logic
        run: node docker/test/session_logic_test.mjs
      - name: Rust tests
        run: docker compose run --rm rust-test
      - name: UI build
        run: docker compose run --rm ui bash -lc "npm install && npm run build"

  linux:
    needs: [resolve, quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            label: x86_64
          - platform: linux/arm64
            label: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Linux ${{ matrix.label }}
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release/build-linux-docker.sh
          BIN="artifacts/release/dup-finder-linux-${{ matrix.label }}"
          test -x "$BIN"
          bash scripts/release/sbom-syft.sh || true
          BIN="$BIN" VERSION="$VERSION" bash scripts/release/package-deb.sh
          BIN="$BIN" VERSION="$VERSION" bash scripts/release/package-rpm.sh
          PLATFORM="$PLATFORM" VERSION="$VERSION" bash scripts/release/package-appimage.sh || true
          ls -la artifacts/release/
      - name: Smoke Linux CLI
        # Native amd64 only — arm64 binary is qemu-built and may be slow to exec here.
        if: matrix.label == 'x86_64'
        env:
          BIN: artifacts/release/dup-finder-linux-x86_64
        run: bash scripts/release/smoke-cli.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.label }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: [resolve, quality-gate]
    if: needs.resolve.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target | src-tauri -> src-tauri/target"
      - name: Engine/app unit tests (host)
        run: cargo test -p dup-finder-app -p dup-finder-engine --release
      - name: Build CLI (macOS)
        run: |
          set -euo pipefail
          cargo build -p dup-finder-cli --release
          mkdir -p artifacts/release
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64|aarch64) LABEL=arm64 ;;
            x86_64) LABEL=x86_64 ;;
            *) LABEL="$ARCH" ;;
          esac
          echo "label=$LABEL" >> "$GITHUB_ENV"
          cp "target/release/dup-finder" "artifacts/release/dup-finder-macos-${LABEL}"
          chmod +x "artifacts/release/dup-finder-macos-${LABEL}"
          (cd artifacts/release && shasum -a 256 "dup-finder-macos-${LABEL}" > "SHA256SUMS-macos-${LABEL}")
      - name: Smoke macOS CLI
        run: |
          set -euo pipefail
          BIN="$(ls artifacts/release/dup-finder-macos-* | head -n 1)"
          BIN="$BIN" bash scripts/release/smoke-cli.sh
      - name: UI build
        if: needs.resolve.outputs.tauri == 'true'
        run: npm --prefix ui ci && npm --prefix ui run build
      - name: Tauri build (macOS)
        if: needs.resolve.outputs.tauri == 'true'
        working-directory: src-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build
      - name: Smoke macOS Tauri bundle
        if: needs.resolve.outputs.tauri == 'true'
        env:
          PLATFORM: macos
          BUNDLE_DIR: src-tauri/target/release/bundle
          RELEASE_DIR: src-tauri/target/release
        run: bash scripts/desktop/smoke-bundle.sh
      - name: Stage Tauri installers into artifacts
        if: needs.resolve.outputs.tauri == 'true'
        run: |
          set -euo pipefail
          # Only ship installers with unique names (do not dump whole bundle tree).
          DMG="$(find src-tauri/target/release/bundle -type f -name '*.dmg' | head -n 1 || true)"
          APP="$(find src-tauri/target/release/bundle -type d -name '*.app' | head -n 1 || true)"
          test -n "$DMG" || test -n "$APP" || { echo "no macOS installer found" >&2; exit 1; }
          if [ -n "$DMG" ]; then
            cp "$DMG" "artifacts/release/Dup-Finder-macos-${label}.dmg"
          fi
          if [ -n "$APP" ]; then
            ditto -c -k --keepParent "$APP" "artifacts/release/Dup-Finder-macos-${label}.app.zip"
          fi
          ls -la artifacts/release/
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: [resolve, quality-gate]
    if: needs.resolve.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target | src-tauri -> src-tauri/target"
      - name: Engine/app unit tests (host)
        run: cargo test -p dup-finder-app -p dup-finder-engine --release
      - name: Build CLI (Windows)
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p dup-finder-cli --release
          mkdir -p artifacts/release
          cp target/release/dup-finder.exe artifacts/release/dup-finder-windows-x86_64.exe
          (cd artifacts/release && sha256sum dup-finder-windows-x86_64.exe > SHA256SUMS-windows-x86_64)
      - name: Smoke Windows CLI
        shell: bash
        env:
          BIN: artifacts/release/dup-finder-windows-x86_64.exe
        run: bash scripts/release/smoke-cli.sh
      - name: UI build
        if: needs.resolve.outputs.tauri == 'true'
        run: npm --prefix ui ci && npm --prefix ui run build
      - name: Tauri build (Windows)
        if: needs.resolve.outputs.tauri == 'true'
        working-directory: src-tauri
        shell: bash
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build
      - name: Smoke Windows Tauri bundle
        if: needs.resolve.outputs.tauri == 'true'
        shell: bash
        env:
          PLATFORM: windows
          BUNDLE_DIR: src-tauri/target/release/bundle
          RELEASE_DIR: src-tauri/target/release
        run: bash scripts/desktop/smoke-bundle.sh
      - name: Stage Tauri installers into artifacts
        if: needs.resolve.outputs.tauri == 'true'
        shell: bash
        run: |
          set -euo pipefail
          MSI="$(find src-tauri/target/release/bundle -type f -name '*.msi' | head -n 1 || true)"
          NSIS="$(find src-tauri/target/release/bundle -type f -name '*setup*.exe' | head -n 1 || true)"
          if [ -z "$NSIS" ]; then
            NSIS="$(find src-tauri/target/release/bundle/nsis -type f -name '*.exe' 2>/dev/null | head -n 1 || true)"
          fi
          test -n "$MSI" || test -n "$NSIS" || { echo "no Windows installer found" >&2; exit 1; }
          [ -n "$MSI" ] && cp "$MSI" artifacts/release/Dup-Finder-windows-x86_64.msi
          [ -n "$NSIS" ] && cp "$NSIS" artifacts/release/Dup-Finder-windows-x86_64-setup.exe
          ls -la artifacts/release/
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, quality-gate, linux, macos, windows]
    if: |
      always()
      && needs.resolve.result == 'success'
      && needs.quality-gate.result == 'success'
      && needs.linux.result == 'success'
      && (needs.resolve.outputs.desktop != 'true' || (needs.macos.result == 'success' && needs.windows.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: gathered
      - name: Assemble release tree
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release artifacts/dist
          for dir in gathered/*/; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            while IFS= read -r -d '' f; do
              rel="${f#"$dir"}"
              case "$rel" in
                SHA256SUMS|SHA256SUMS-*) continue ;;
              esac
              if [[ "$rel" == */* ]]; then
                dest="artifacts/release/${name}/${rel}"
              else
                dest="artifacts/release/${rel}"
              fi
              mkdir -p "$(dirname "$dest")"
              cp "$f" "$dest"
            done < <(find "$dir" -type f -print0)
          done
          (
            cd artifacts/release
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name 'NOTICE.txt' \
              | sed 's|^\./||' | sort \
              | while read -r f; do shasum -a 256 "$f"; done > SHA256SUMS
          )
          VERSION="$VERSION" bash scripts/release/make-dist.sh || true
          echo "=== release tree ==="
          find artifacts -type f | sort

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAURI: ${{ needs.resolve.outputs.tauri }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          {
            echo "## Dup Finder ${TAG}"
            echo
            echo "Built once per platform, smoked, then published (no rebuild)."
            echo
            echo "### Linux"
            echo "- \`dup-finder-linux-x86_64\` / \`dup-finder-linux-arm64\`"
            echo "- \`.deb\` / \`.rpm\` / AppDir / dist tarball when present"
            echo
            echo "### macOS / Windows"
            echo "- \`dup-finder-macos-*\` CLI"
            echo "- \`dup-finder-windows-x86_64.exe\` CLI"
            if [ "$TAURI" = "true" ]; then
              echo "- \`Dup-Finder-macos-*.dmg\` / \`.app.zip\`"
              echo "- \`Dup-Finder-windows-x86_64.msi\` / \`-setup.exe\`"
            else
              echo "- Tauri GUI skipped this run (\`include_tauri=false\` or private repo)"
            fi
            echo
            echo "Verify top-level files: \`shasum -a 256 -c SHA256SUMS\`"
            echo
            echo "Container: \`ghcr.io/${{ github.repository_owner }}/dup-finder:${TAG}\`"
            echo
            echo "Docs live in-repo (\`docs/\`). Wiki is disabled."
          } > "$NOTES"
          # Flat unique basenames only — avoids GitHub asset name collisions from nested bundles.
          STAGE="$(mktemp -d)"
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              SHA256SUMS|SHA256SUMS-*) continue ;;
            esac
            dest="$STAGE/$base"
            if [ -e "$dest" ]; then
              echo "duplicate basename skipped: $f" >&2
              continue
            fi
            cp "$f" "$dest"
          done < <(find artifacts/release artifacts/dist -type f -print0 2>/dev/null)
          mapfile -t FILES < <(find "$STAGE" -type f | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no release files" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes-file "$NOTES" --title "Dup Finder ${TAG}"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Dup Finder ${TAG}" \
              --notes-file "$NOTES"
          fi

      - name: Publish Linux images to GHCR
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${{ github.repository_owner }}/dup-finder"
          docker build -f docker/Dockerfile.release -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "If pulls fail with denied: set package visibility to Public under GitHub → Packages → dup-finder."
