# Free-tier multi-platform publish (public repo → standard hosted runners are free).
# - Linux amd64 + arm64 (ubuntu-latest + buildx/qemu)
# - macOS + Windows CLI (macos-latest / windows-latest; skipped on private unless forced)
# - GitHub Release assets + GHCR (linux amd64 image; multi-arch when both build)
# No larger/GPU/self-hosted runners. No cosign (optional later).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish (e.g. v0.1.0)
        required: true
        type: string
      include_desktop_hosts:
        description: Build macOS/Windows CLI on free hosted runners
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      desktop: ${{ steps.ver.outputs.desktop }}
    steps:
      - id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DESKTOP: ${{ inputs.include_desktop_hosts }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            DESKTOP="$INPUT_DESKTOP"
          else
            TAG="${GITHUB_REF_NAME}"
            DESKTOP=true
          fi
          case "$TAG" in v*) ;; *) echo "tag must start with v" >&2; exit 1 ;; esac
          if [ "$PRIVATE" = "true" ]; then
            DESKTOP=false
            echo "Private repo: skipping macOS/Windows hosted runners (free-minute cost)."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"

  linux:
    needs: resolve
    runs-on: ubuntu-latest
    # arm64 via qemu is slow but still free; keep a hard cap so the release cannot hang.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            label: x86_64
          - platform: linux/arm64
            label: arm64
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Linux ${{ matrix.label }}
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release/build-linux-docker.sh
          BIN="artifacts/release/dup-finder-linux-${{ matrix.label }}"
          test -x "$BIN"
          bash scripts/release/sbom-syft.sh || true
          BIN="$BIN" VERSION="$VERSION" bash scripts/release/package-deb.sh
          BIN="$BIN" VERSION="$VERSION" bash scripts/release/package-rpm.sh
          PLATFORM="$PLATFORM" VERSION="$VERSION" bash scripts/release/package-appimage.sh || true
          ls -la artifacts/release/
      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.label }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  # CLI only here — Tauri GUI is manual via desktop-host.yml (avoids 60m+ hangs).
  macos:
    needs: resolve
    if: needs.resolve.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build CLI (macOS)
        run: |
          set -euo pipefail
          cargo build -p dup-finder-cli --release
          mkdir -p artifacts/release
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64|aarch64) LABEL=arm64 ;;
            x86_64) LABEL=x86_64 ;;
            *) LABEL="$ARCH" ;;
          esac
          cp "target/release/dup-finder" "artifacts/release/dup-finder-macos-${LABEL}"
          chmod +x "artifacts/release/dup-finder-macos-${LABEL}"
          (cd artifacts/release && shasum -a 256 "dup-finder-macos-${LABEL}" > "SHA256SUMS-macos-${LABEL}")
          ls -la artifacts/release/
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: resolve
    if: needs.resolve.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build CLI (Windows)
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p dup-finder-cli --release
          mkdir -p artifacts/release
          cp target/release/dup-finder.exe artifacts/release/dup-finder-windows-x86_64.exe
          (cd artifacts/release && sha256sum dup-finder-windows-x86_64.exe > SHA256SUMS-windows-x86_64)
          ls -la artifacts/release/
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, linux, macos, windows]
    if: always() && needs.resolve.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Download all platform artifacts
        uses: actions/download-artifact@v5
        with:
          path: gathered
      - name: Assemble release tree
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release artifacts/dist
          # Each uploaded artifact is gathered/<name>/...
          for dir in gathered/*/; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            while IFS= read -r -d '' f; do
              rel="${f#"$dir"}"
              case "$rel" in
                SHA256SUMS|SHA256SUMS-*) continue ;;
              esac
              # Nested bundles keep platform prefix; flat packages share release/
              if [[ "$rel" == */* ]]; then
                dest="artifacts/release/${name}/${rel}"
              else
                dest="artifacts/release/${rel}"
              fi
              mkdir -p "$(dirname "$dest")"
              cp "$f" "$dest"
            done < <(find "$dir" -type f -print0)
          done
          (
            cd artifacts/release
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name 'NOTICE.txt' \
              | sed 's|^\./||' | sort \
              | while read -r f; do shasum -a 256 "$f"; done > SHA256SUMS
          )
          VERSION="$VERSION" bash scripts/release/make-dist.sh || true
          echo "=== release tree ==="
          find artifacts -type f | sort

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          {
            echo "## Dup Finder ${TAG}"
            echo
            echo "Multi-platform packages from **free** GitHub-hosted runners (no paid features)."
            echo
            echo "### Linux (ubuntu-latest)"
            echo "- \`dup-finder-linux-x86_64\` / \`dup-finder-linux-arm64\`"
            echo "- \`.deb\` (\`amd64\`, \`arm64\`) and \`.rpm\` (\`x86_64\`, \`aarch64\`) when present"
            echo "- AppDir / dist tarball when present"
            echo
            echo "### macOS / Windows (free hosted; public repo)"
            echo "- \`dup-finder-macos-*\` CLI"
            echo "- \`dup-finder-windows-x86_64.exe\` CLI"
            echo "- Tauri GUI (\`.dmg\` / MSI): run workflow \`desktop-host\` manually (not in this job — avoids long hangs)"
            echo
            echo "Verify top-level files: \`shasum -a 256 -c SHA256SUMS\`"
            echo
            echo "Docs live in-repo (\`docs/\`). Wiki is disabled."
          } > "$NOTES"
          mapfile -t FILES < <(find artifacts/release artifacts/dist -type f 2>/dev/null | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no release files" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes-file "$NOTES" --title "Dup Finder ${TAG}"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Dup Finder ${TAG}" \
              --notes-file "$NOTES"
          fi

      - name: Publish Linux images to GHCR
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${{ github.repository_owner }}/dup-finder"
          docker build -f docker/Dockerfile.release -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "If pulls fail with denied: set package visibility to Public under GitHub → Packages → dup-finder."
